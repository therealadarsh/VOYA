name: CI

on:
  pull_request:
    branches: [dev, uat, prod]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install and verify
        run: make verify

  postgres:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Migrate
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: uv run alembic upgrade head
      - name: Postgres integration tests
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          VOYA_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: uv run pytest -q -p no:warnings tests/test_p1_nyc.py tests/test_f11_migrations.py

  e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium and system libraries
        run: uv run playwright install --with-deps chromium
      - name: Browser tests
        run: make e2e

  docker:
    needs: verify
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container smoke test
        run: bash scripts/smoke.sh