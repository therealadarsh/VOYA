[project]
name = "voya"
version = "0.1.0"
description = "Budget-aware trip planner whose cost estimates say how sure they are."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
