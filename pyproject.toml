[project]
name = "voya"
version = "0.1.0"
description = "Budget-aware trip planner whose cost estimates say how sure they are."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.9",
    "pydantic[email]>=2.7",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
voya = "voya.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["SIM102"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
